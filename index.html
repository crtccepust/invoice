<link rel="icon" type="image/svg+xml" href="assets/logo.svg">

<div id="auth"></div>
<div id="loader" role="status" aria-live="polite"><div class="ld-wrap"><span class="ld-ring"></span><span class="ld-ring ld-ring2"></span><img class="ld-logo" src="assets/logo.svg" alt=""></div><div class="ld-msg"><span id="ldmsg">Connecting to server…</span><span class="ld-dots"><i></i><i></i><i></i></span></div></div>
<header>
  <div class="brand"><img src="assets/logo-white.svg" alt="CRTC"><div><h1>CRTC Invoice System</h1><small id="sync">Not signed in</small></div></div>
  <div class="row" style="margin:0"><span id="who" style="font-size:13px"></span><button onclick="chpwModal()">Password</button><button onclick="logout()">Sign out</button></div>
</header>
<nav id="nav"></nav>
